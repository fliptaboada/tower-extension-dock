<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tower</title>
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="dock.css">
<script src="/tower.js"></script>
</head>
<body>
<nav class="rail" aria-label="Renderers">
  <div class="marks"></div>
  <div class="foot">
    <button type="button" class="tool" id="pin-btn" aria-label="Pin a shelf page" aria-haspopup="dialog" aria-expanded="false" aria-controls="pin-pop">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <button type="button" class="tool" id="ext-btn" aria-label="Extensions" aria-haspopup="dialog" aria-expanded="false" aria-controls="ext-pop">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 3.6a1.55 1.55 0 1 1 3.1 0V4.5h3.2v3.2h-.9a1.55 1.55 0 1 0 0 3.1h.9V14H9.3v-.9a1.55 1.55 0 1 0-3.1 0v.9H3V10.8h.9a1.55 1.55 0 1 0 0-3.1H3V4.5h3.2z"/></svg>
      <span class="alert" hidden></span>
    </button>
    <button type="button" class="tool" id="config-btn" aria-label="Config" aria-haspopup="dialog" aria-expanded="false" aria-controls="config-pop">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.9 1.5h2.2l.4 1.9 1.3.7 1.8-.7 1.1 1.9-1.4 1.3v1.5l1.4 1.3-1.1 1.9-1.8-.7-1.3.7-.4 1.9H6.9l-.4-1.9-1.3-.7-1.8.7-1.1-1.9 1.4-1.3V6.6L2.3 5.3l1.1-1.9 1.8.7 1.3-.7z"/><circle cx="8" cy="8" r="2"/></svg>
    </button>
  </div>
</nav>
<div class="pop" id="pin-pop" role="dialog" aria-label="Pin a shelf page" hidden>
  <p class="eyebrow">Pin a shelf page</p>
  <div id="pin-list" role="menu"></div>
  <p class="said" id="pin-said" role="status" hidden></p>
  <p class="where">Kept in <code>extensions.dock.settings.pins</code></p>
</div>
<div class="pop wide" id="ext-pop" role="dialog" aria-label="Extensions" hidden>
  <p class="eyebrow">Extensions <span id="ext-summary"></span></p>
  <div id="ext-list"></div>
  <div class="acts"><button type="button" id="ext-full">Open the full panel</button></div>
</div>
<div class="pop" id="config-pop" role="dialog" aria-label="Config" hidden>
  <p class="eyebrow">Config</p>
  <code class="path"><bdi id="config-path"></bdi></code>
  <div class="acts">
    <button type="button" data-verb="edit">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.2 14 4.6v6.8L8 14.8 2 11.4V4.6z"/><path d="M2 4.6 8 8l6-3.4M8 8v6.8"/></svg>
      Open in editor</button>
    <button type="button" data-verb="reveal">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.4 1.6h6a1 1 0 0 1 1 1v7.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M1.5 6.5h13"/></svg>
      Show in Finder</button>
  </div>
  <p class="said" id="config-said" role="status" hidden></p>
</div>
<main class="stage"><p class="empty">Opening…</p></main>
<script type="module" src="dock.js"></script>
</body>
</html>
